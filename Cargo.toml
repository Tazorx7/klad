[package]
name = "klad"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
ignore = "0.4"
memchr = "2.7"
rayon = "1.12"
regex = "1.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
